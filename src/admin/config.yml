                fields:
                  - { name: tag, label: "תגית קטנה מעל הכותרת (לא חובה)", widget: string, required: false }
                  - { name: title, label: כותרת, widget: string }
                  - { name: text, label: טקסט, widget: text }
                  - name: points
                    label: "נקודות (לא חובה)"
                    label_singular: נקודה
                    widget: list
                    required: false
                    field: { name: point, label: נקודה, widget: string }
                  - { name: image, label: תמונה, widget: image }
                  - { name: alt, label: "תיאור התמונה (לנגישות)", widget: string }
          - name: features
            label: "אזור 5: כל היכולות"
            widget: object
            fields:
              - { name: heading, label: "כותרת (לא חובה)", widget: string, required: false }
              - { name: subtitle, label: "שורה מתחת לכותרת (לא חובה)", widget: string, required: false }
              - name: cards
                label: כרטיסים
                label_singular: כרטיס
                hint: "בלי כרטיסים – האזור לא מופיע."
                widget: list
                required: false
                summary: "{{fields.title}}"
