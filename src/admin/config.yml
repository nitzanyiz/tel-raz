# Sveltia CMS configuration – what the editor can change at /admin.
# Every editable file is listed here. Fields marked `widget: hidden` are
# developer-only: they are kept as-is when the editor saves.
# tests/cms.test.js checks this file against the content files.

backend:
  name: github
  repo: nitzanyiz/tel-raz
  branch: master
  base_url: https://api.netlify.com
  site_domain: tel-raz.com
  commit_messages:
    create: "תוכן: יצירת {{collection}} \"{{slug}}\""
    update: "תוכן: עדכון {{collection}} \"{{slug}}\""
    delete: "תוכן: מחיקת {{collection}} \"{{slug}}\""
    uploadMedia: "תוכן: העלאת \"{{path}}\""
    deleteMedia: "תוכן: מחיקת \"{{path}}\""

site_url: https://tel-raz.com
display_url: https://tel-raz.com
logo_url: /assets/img/favicon.png

media_folder: src/assets/uploads
public_folder: /assets/uploads

media_libraries:
  default:
    config:
      max_file_size: 10000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  # ---------------------------------------------------------------- settings
  - name: settings
    label: פרטי האתר
    files:
      - name: site
        label: פרטי האתר ויצירת קשר
        file: src/content/site.json
        fields:
          - { name: name, label: שם החברה, widget: string }
          - { name: url, widget: hidden }
          - { name: phoneDisplay, label: "טלפון (כפי שמוצג באתר, למשל 09-7601760)", widget: string }
          - { name: phoneDial, label: "טלפון לחיוג (בפורמט בינלאומי, למשל ‎+97297601760)", widget: string, pattern: ['^\+972\d{8,9}$', 'מתחיל ב-‎+972 ואחריו ספרות בלבד, בלי 0 ובלי מקפים'] }
          - { name: whatsapp, label: "מספר וואטסאפ (ספרות בלבד, עם 972 ובלי 0 בהתחלה, למשל 97297601760). ריק = הכפתור לא יוצג", widget: string, required: false, pattern: ['^$|^972\d{8,9}$', 'ספרות בלבד: 972 ואחריו המספר בלי ה-0 (למשל 97297601760)'] }
          - { name: email, label: "דוא\"ל", widget: string, required: false, pattern: ['^$|^[^@\s]+@[^@\s]+\.[^@\s]+$', 'כתובת דוא"ל לא תקינה'] }
          - { name: address, label: "כתובת (מוצגת באתר וגם במפה). ריק = לא תוצג", widget: string, required: false }
          - { name: hours, label: "שעות פעילות. ריק = לא יוצגו", widget: string, required: false }
          - name: social
            label: רשתות חברתיות (קישור מלא, ריק = לא יוצג)
            widget: object
            fields:
              - { name: facebook, label: פייסבוק, widget: string, required: false, pattern: ['^$|^https://\S+$', 'כתובת מלאה שמתחילה ב-https://'] }
              - { name: instagram, label: אינסטגרם, widget: string, required: false, pattern: ['^$|^https://\S+$', 'כתובת מלאה שמתחילה ב-https://'] }
              - { name: linkedin, label: לינקדאין, widget: string, required: false, pattern: ['^$|^https://\S+$', 'כתובת מלאה שמתחילה ב-https://'] }
              - { name: youtube, label: יוטיוב, widget: string, required: false, pattern: ['^$|^https://\S+$', 'כתובת מלאה שמתחילה ב-https://'] }
          - { name: remoteSupportUrl, label: "קישור להשתלטות מרחוק (ריק = הפריט לא יוצג בתפריט)", widget: string, required: false, pattern: ['^$|^https://\S+$', 'כתובת מלאה שמתחילה ב-https://'] }
          - { name: footerAbout, label: משפט על החברה בתחתית האתר, widget: text, required: false }
          - { name: seoDescription, label: "תיאור האתר לגוגל (ברירת מחדל, עד כ-155 תווים)", widget: text }

  # -------------------------------------------------------------- downloads
  - name: downloads
    label: קבצים להורדה
    files:
      - name: downloads
        label: רשימת המדריכים והקבצים להורדה
        file: src/content/downloads.json
        fields:
          - name: items
            label: קבצים (אפשר לגרור כדי לשנות סדר)
            label_singular: קובץ
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: כותרת, widget: string }
              - { name: desc, label: תיאור קצר, widget: string, required: false }
              - name: file
                label: קובץ
                widget: file
                media_folder: /src/files
                public_folder: /files

  # ------------------------------------------------------------------- home
  - name: home
    label: דף הבית
    files:
      - name: home
        label: דף הבית
        file: src/content/home.json
        fields:
          - { name: heroTitle, label: כותרת ראשית, widget: string }
          - { name: heroSubtitle, label: משפט משנה, widget: text }
          - { name: heroCtaContact, label: "טקסט כפתור 'צור קשר'", widget: string }
          - { name: heroCtaCall, label: "טקסט כפתור 'התקשרו'", widget: string }
          - { name: tilesTitle, label: כותרת אזור השירותים, widget: string }
          - name: tiles
            label: כרטיסי שירותים
            label_singular: כרטיס
            widget: list
            allow_add: false
            allow_remove: false
            allow_reorder: true
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: כותרת, widget: string }
              - { name: text, label: טקסט קצר, widget: text }
              - { name: image, label: תמונה (לא חובה), widget: image, required: false }
              - { name: url, widget: hidden }
          - { name: whyTitle, label: "כותרת אזור 'למה אנחנו'", widget: string }
          - name: why
            label: "נקודות 'למה אנחנו'"
            label_singular: נקודה
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: כותרת, widget: string }
              - { name: text, label: טקסט, widget: text }
              - name: icon
                label: אייקון
                widget: select
                options:
                  - { label: ענן, value: cloud }
                  - { label: תמיכה, value: support }
                  - { label: מגן, value: shield }
                  - { label: אוזניות, value: headset }
          - { name: customersTitle, label: כותרת אזור הלקוחות, widget: string }
          - name: customers
            label: "לוגואים של לקוחות (האזור מוסתר כשהרשימה ריקה)"
            label_singular: לקוח
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: שם הלקוח, widget: string }
              - { name: logo, label: לוגו, widget: image }
          - { name: contactTitle, label: כותרת אזור יצירת הקשר, widget: string }
          - { name: contactText, label: טקסט אזור יצירת הקשר, widget: string }

  # ------------------------------------------------------------------ pages
  # All pages live in src/pages/ (file name = address). Two filtered views:
  # עמודים (content, add/delete) and עמודי מערכת (system, text + menu only).
  # A hidden third view feeds the "קישור לעמוד" dropdowns with every page.
  - name: pages
    label: עמודים
    label_singular: עמוד
    folder: src/pages
    extension: md
    format: frontmatter
    filter: { field: system, value: false }
    create: true
    delete: true
    slug:
      editable: [create]
      pattern: ['^(?!(admin|assets|files|support)$)[a-z0-9]+(-[a-z0-9]+)*$', 'כתובת: אותיות באנגלית קטנות, ספרות ומקפים בלבד (למשל ns1000 או winter-sale)']
      hint: 'הכתובת של העמוד באתר (tel-raz.com/הכתובת). נקבעת ביצירת העמוד ולא ניתן לשנות אותה אחר כך.'
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { name: title, label: כותרת העמוד, widget: string }
      - { name: intro, label: משפט פתיחה, widget: text, required: false }
      - name: images
        label: תמונות
        label_singular: תמונה
        widget: list
        required: false
        summary: "{{fields.alt}}"
        fields:
          - { name: src, label: תמונה, widget: image }
          - { name: alt, label: "תיאור התמונה (לנגישות)", widget: string }
      - name: imagePosition
        label: מיקום התמונות
        widget: select
        default: side
        required: false
        options:
          - { label: "בצד הטקסט", value: side }
          - { label: "מעל הטקסט", value: top }
          - { label: "מתחת לטקסט", value: bottom }
      - { name: body, label: תוכן העמוד, widget: markdown, required: false }
      - name: items
        label: פריטים (כרטיסים)
        label_singular: פריט
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields:
          - { name: name, label: שם, widget: string }
          - { name: image, label: תמונה, widget: image, required: false }
          - { name: text, label: תיאור קצר, widget: text, required: false }
          - { name: link, label: קישור לעמוד, widget: relation, collection: all_pages, value_field: "{{slug}}", search_fields: [title], display_fields: [title], required: false, filters: [{ field: sitemap, values: [true] }] }
          - { name: linkText, label: "טקסט הקישור (ריק = לפרטים נוספים)", widget: string, required: false }
      - { name: contactForm, label: הצגת טופס יצירת קשר בתחתית העמוד, widget: boolean, required: false, default: true }
      - name: menu
        label: תפריט
        widget: object
        collapsed: true
        hint: "האם העמוד מופיע בתפריט העליון, ואיפה"
        fields:
          - { name: inMenu, label: להציג בתפריט, widget: boolean, default: false, required: false }
          - name: parent
            label: מתחת לכותרת
            widget: select
            required: false
            default: ""
            options:
              - { label: "שורת התפריט הראשית", value: "" }
              - { label: "שירותים", value: services }
              - { label: "שירותים › שירותי מרכזיה בענן", value: cloud-pbx }
              - { label: "שירותים › מרכזיה", value: pbx }
              - { label: "שירות ותמיכה", value: support }
          - { name: order, label: "מיקום (מספר קטן = ראשון)", widget: number, value_type: int, required: false }
          - { name: title, label: "שם קצר בתפריט (ריק = כותרת העמוד)", widget: string, required: false }
      - { name: seoTitle, label: "כותרת לגוגל (לא חובה)", widget: string, required: false }
      - { name: seoDescription, label: "תיאור לגוגל (עד כ-155 תווים)", widget: text, required: false }
      - { name: system, widget: hidden, default: false }
      - { name: sitemap, widget: hidden, default: true }
      # legacy keys, migrated away in the next step (kept so saves don't drop them)
      - { name: image, widget: hidden }
      - { name: imageAlt, widget: hidden }
      - { name: models, widget: hidden }

  - name: system_pages
    label: עמודי מערכת
    label_singular: עמוד מערכת
    description: "עמודים שהאתר תלוי בהם: אפשר לערוך את הטקסט ואת המיקום בתפריט, אבל לא למחוק אותם או לשנות את הכתובת."
    folder: src/pages
    extension: md
    format: frontmatter
    filter: { field: system, value: true }
    create: false
    delete: false
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { name: title, label: כותרת העמוד, widget: string }
      - { name: intro, label: משפט פתיחה, widget: text, required: false }
      - { name: body, label: תוכן העמוד, widget: markdown, required: false }
      - name: menu
        label: תפריט
        widget: object
        collapsed: true
        hint: "האם העמוד מופיע בתפריט העליון, ואיפה"
        fields:
          - { name: inMenu, label: להציג בתפריט, widget: boolean, default: false, required: false }
          - name: parent
            label: מתחת לכותרת
            widget: select
            required: false
            default: ""
            options:
              - { label: "שורת התפריט הראשית", value: "" }
              - { label: "שירותים", value: services }
              - { label: "שירותים › שירותי מרכזיה בענן", value: cloud-pbx }
              - { label: "שירותים › מרכזיה", value: pbx }
              - { label: "שירות ותמיכה", value: support }
          - { name: order, label: "מיקום (מספר קטן = ראשון)", widget: number, value_type: int, required: false }
          - { name: title, label: "שם קצר בתפריט (ריק = כותרת העמוד)", widget: string, required: false }
      - { name: seoTitle, label: "כותרת לגוגל (לא חובה)", widget: string, required: false }
      - { name: seoDescription, label: "תיאור לגוגל (עד כ-155 תווים)", widget: text, required: false }
      - { name: system, widget: hidden, default: true }
      - { name: sitemap, widget: hidden }
      - { name: image, widget: hidden }
      - { name: imageAlt, widget: hidden }

  - name: all_pages
    label: כל העמודים
    folder: src/pages
    extension: md
    format: frontmatter
    hide: true
    create: false
    delete: false
    identifier_field: title
    fields:
      - { name: title, widget: string }
      - { name: sitemap, widget: hidden }
