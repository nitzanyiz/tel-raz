            fields:
              - { name: title, label: כותרת, widget: string }
              - { name: text, label: "טקסט (לא חובה)", widget: string, required: false }
              - { name: button, label: טקסט הכפתור, widget: string }
          - name: highlights
            label: "אזור 4: מה מייחד (טקסט ותמונה)"
