# "פרסום האתר" – publishes the preview (master) to the live site.
# Run manually from GitHub: Actions → פרסום האתר → Run workflow.
# It fast-forwards the production branch to master; Netlify then deploys it.
# If production has commits master doesn't, the push fails instead of overwriting.
name: פרסום האתר

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      # Build master first: if the preview is broken (e.g. a card links to a
      # deleted page), the run fails with a red X instead of publishing it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the site (fails if the preview is broken)
        run: npm ci && npm run build
      - name: Fast-forward production to master
        run: git push origin origin/master:refs/heads/production
